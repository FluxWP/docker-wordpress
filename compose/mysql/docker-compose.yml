# FluxWP docker-wordpress: WordPress + MySQL (Apache)
# https://github.com/FluxWP/docker-wordpress
#
# Usage: cp .env.example .env  (set passwords)  &&  docker compose up -d
# Generated by tools/build.py from config/ and scripts/ - edit those, then rebuild.

services:
  wordpress:
    image: 'wordpress:7.1-php8.4-apache'
    restart: unless-stopped
    volumes:
      - 'wordpress-files:/var/www/html'
      - ../../config/php/zz-flux.ini:/usr/local/etc/php/conf.d/zz-flux.ini:ro
      - ../../config/apache/zz-flux.conf:/etc/apache2/conf-enabled/zz-flux.conf:ro
      - ../../config/wordpress/wp-config-extra.php:/usr/local/etc/flux/wp-config-extra.php:ro
    environment:
      - WORDPRESS_DB_HOST=mysql
      - WORDPRESS_DB_USER=${DB_USER:-wordpress}
      - WORDPRESS_DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - WORDPRESS_DB_NAME=${DB_NAME:-wordpress}
      - WORDPRESS_TABLE_PREFIX=${WORDPRESS_TABLE_PREFIX:-wp_}
      - "WORDPRESS_CONFIG_EXTRA=if (is_file('/usr/local/etc/flux/wp-config-extra.php')) { require '/usr/local/etc/flux/wp-config-extra.php'; }"
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-256M}
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE:-128M}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE:-128M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-300}
      - PHP_OPCACHE_MEMORY=${PHP_OPCACHE_MEMORY:-192}
      - PHP_TIMEZONE=${PHP_TIMEZONE:-UTC}
      - WP_ENVIRONMENT_TYPE=${WP_ENVIRONMENT_TYPE:-production}
      - WP_CRON_MODE=worker
      - APACHE_MAX_WORKERS=${APACHE_MAX_WORKERS:-20}
    ports:
      - '${HTTP_PORT:-8080}:80'
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1/wp-includes/images/blank.gif']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
  # One-time setup (auto install, language, Redis, Flux Setup) + WP-Cron every minute.
  worker:
    image: 'wordpress:cli-2.12-php8.4'
    restart: unless-stopped
    user: '33:33'
    entrypoint: ['/bin/sh', '/usr/local/bin/flx-worker']
    volumes:
      - 'wordpress-files:/var/www/html'
      - ../../scripts/worker.sh:/usr/local/bin/flx-worker:ro
      - ../../config/php/zz-flux.ini:/usr/local/etc/php/conf.d/zz-flux.ini:ro
      - ../../config/wordpress/wp-config-extra.php:/usr/local/etc/flux/wp-config-extra.php:ro
    environment:
      - WORDPRESS_DB_HOST=mysql
      - WORDPRESS_DB_USER=${DB_USER:-wordpress}
      - WORDPRESS_DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - WORDPRESS_DB_NAME=${DB_NAME:-wordpress}
      - WORDPRESS_TABLE_PREFIX=${WORDPRESS_TABLE_PREFIX:-wp_}
      - "WORDPRESS_CONFIG_EXTRA=if (is_file('/usr/local/etc/flux/wp-config-extra.php')) { require '/usr/local/etc/flux/wp-config-extra.php'; }"
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-256M}
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE:-128M}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE:-128M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-300}
      - PHP_OPCACHE_MEMORY=${PHP_OPCACHE_MEMORY:-192}
      - PHP_TIMEZONE=${PHP_TIMEZONE:-UTC}
      - WP_ENVIRONMENT_TYPE=${WP_ENVIRONMENT_TYPE:-production}
      - WP_CRON_MODE=worker
      - HOME=/tmp
      - WP_CLI_CACHE_DIR=/tmp/wp-cli-cache
      - WP_URL=${WP_URL:-}
      - WP_TITLE=${WP_TITLE:-WordPress}
      - WP_ADMIN_USER=${WP_ADMIN_USER:-admin}
      - WP_ADMIN_PASSWORD=${WP_ADMIN_PASSWORD:-}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL:-}
      - WP_LOCALE=${WP_LOCALE:-en_US}
      - WP_TIMEZONE=${WP_TIMEZONE:-UTC}
      - WP_CRON_INTERVAL=${WP_CRON_INTERVAL:-60}
      - FLUXWP_SETUP=${FLUXWP_SETUP:-false}
      - FLUXWP_SETUP_URL=${FLUXWP_SETUP_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
      wordpress:
        condition: service_started
    security_opt:
      - no-new-privileges:true
  mysql:
    image: 'mysql:8.4'
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL_SIZE:-256M}
      - --max-connections=${DB_MAX_CONNECTIONS:-100}
      - --max-allowed-packet=64M
      - --skip-name-resolve
      - --performance-schema=OFF
      - --disable-log-bin
    volumes:
      - 'mysql-data:/var/lib/mysql'
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      - MYSQL_DATABASE=${DB_NAME:-wordpress}
      - MYSQL_USER=${DB_USER:-wordpress}
      - MYSQL_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    security_opt:
      - no-new-privileges:true

volumes:
  wordpress-files:
  mysql-data:
