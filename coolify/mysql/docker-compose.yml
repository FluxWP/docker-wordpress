# FluxWP docker-wordpress: WordPress + MySQL (Apache)
# https://github.com/FluxWP/docker-wordpress
#
# Coolify: Projects > Add Resource > Docker Compose Empty > paste this file > Save.
# Coolify generates a domain for the 'wordpress' service; put your own there if you like, then Deploy.
# After the first deploy open your domain and create the admin account on the WordPress
# install screen. Optional: set WP_ADMIN_USER, WP_ADMIN_PASSWORD, WP_ADMIN_EMAIL to install
# automatically instead.
# FLUXWP_SETUP=true installs the Flux Setup plugin (FluxWP installer + updates).
# Generated by tools/build.py - edit that, not this file.

services:
  wordpress:
    image: 'ghcr.io/fluxwp/wordpress:7.1-php8.4-apache'
    restart: unless-stopped
    volumes:
      - 'wordpress-files:/var/www/html'
    environment:
      - SERVICE_URL_WORDPRESS
      - WORDPRESS_DB_HOST=mysql
      - WORDPRESS_DB_USER=$SERVICE_USER_WORDPRESS
      - WORDPRESS_DB_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
      - WORDPRESS_DB_NAME=${DB_NAME:-wordpress}
      - WORDPRESS_TABLE_PREFIX=${WORDPRESS_TABLE_PREFIX:-wp_}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-256M}
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE:-128M}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE:-128M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-300}
      - PHP_OPCACHE_MEMORY=${PHP_OPCACHE_MEMORY:-192}
      - PHP_TIMEZONE=${PHP_TIMEZONE:-UTC}
      - WP_ENVIRONMENT_TYPE=${WP_ENVIRONMENT_TYPE:-production}
      - APACHE_MAX_WORKERS=${APACHE_MAX_WORKERS:-20}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1/wp-includes/images/blank.gif']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
  # One-time setup (auto install, language, Redis, Flux Setup) + WP-Cron every minute.
  worker:
    image: 'ghcr.io/fluxwp/wordpress:worker-php8.4'
    restart: unless-stopped
    volumes:
      - 'wordpress-files:/var/www/html'
    environment:
      - WORDPRESS_DB_HOST=mysql
      - WORDPRESS_DB_USER=$SERVICE_USER_WORDPRESS
      - WORDPRESS_DB_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
      - WORDPRESS_DB_NAME=${DB_NAME:-wordpress}
      - WORDPRESS_TABLE_PREFIX=${WORDPRESS_TABLE_PREFIX:-wp_}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-256M}
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE:-128M}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE:-128M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-300}
      - PHP_OPCACHE_MEMORY=${PHP_OPCACHE_MEMORY:-192}
      - PHP_TIMEZONE=${PHP_TIMEZONE:-UTC}
      - WP_ENVIRONMENT_TYPE=${WP_ENVIRONMENT_TYPE:-production}
      - WP_URL=$SERVICE_URL_WORDPRESS
      - WP_TITLE=${WP_TITLE:-WordPress}
      - WP_ADMIN_USER=${WP_ADMIN_USER:-}
      - WP_ADMIN_PASSWORD=${WP_ADMIN_PASSWORD:-}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL:-}
      - WP_AUTO_INSTALL=${WP_AUTO_INSTALL:-false}
      - WP_LOCALE=${WP_LOCALE:-en_US}
      - WP_TIMEZONE=${WP_TIMEZONE:-UTC}
      - WP_CRON_INTERVAL=${WP_CRON_INTERVAL:-60}
      - FLUXWP_SETUP=${FLUXWP_SETUP:-false}
      - FLUXWP_SETUP_URL=${FLUXWP_SETUP_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
      wordpress:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    exclude_from_hc: true
  mysql:
    image: 'mysql:8.4'
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL_SIZE:-256M}
      - --max-connections=${DB_MAX_CONNECTIONS:-100}
      - --max-allowed-packet=64M
      - --skip-name-resolve
      - --performance-schema=OFF
      - --disable-log-bin
    volumes:
      - 'mysql-data:/var/lib/mysql'
    environment:
      - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
      - MYSQL_DATABASE=${DB_NAME:-wordpress}
      - MYSQL_USER=$SERVICE_USER_WORDPRESS
      - MYSQL_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    security_opt:
      - no-new-privileges:true

volumes:
  wordpress-files:
  mysql-data:
