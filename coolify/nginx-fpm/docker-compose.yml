# FluxWP docker-wordpress: WordPress PHP-FPM + nginx + MariaDB + Redis object cache
# https://github.com/FluxWP/docker-wordpress
#
# Coolify: Projects > Add Resource > Docker Compose Empty > paste this file > Save.
# Coolify generates a domain for the 'nginx' service; put your own there if you like, then Deploy.
# After the first deploy open your domain and create the admin account on the WordPress
# install screen. Optional: set WP_ADMIN_USER, WP_ADMIN_PASSWORD, WP_ADMIN_EMAIL to install
# automatically instead.
# FLUXWP_SETUP=true installs the Flux Setup plugin (FluxWP installer + updates).
# Generated by tools/build.py - edit that, not this file.

services:
  wordpress:
    image: 'ghcr.io/fluxwp/wordpress:7.1-php8.4-fpm'
    restart: unless-stopped
    volumes:
      - 'wordpress-files:/var/www/html'
    environment:
      - WORDPRESS_DB_HOST=mariadb
      - WORDPRESS_DB_USER=$SERVICE_USER_WORDPRESS
      - WORDPRESS_DB_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
      - WORDPRESS_DB_NAME=${DB_NAME:-wordpress}
      - WORDPRESS_TABLE_PREFIX=${WORDPRESS_TABLE_PREFIX:-wp_}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-256M}
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE:-128M}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE:-128M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-300}
      - PHP_OPCACHE_MEMORY=${PHP_OPCACHE_MEMORY:-192}
      - PHP_TIMEZONE=${PHP_TIMEZONE:-UTC}
      - WP_ENVIRONMENT_TYPE=${WP_ENVIRONMENT_TYPE:-production}
      - WP_REDIS_HOST=redis
      - WP_REDIS_PASSWORD=$SERVICE_PASSWORD_REDIS
      - PHP_FPM_MAX_CHILDREN=${PHP_FPM_MAX_CHILDREN:-10}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'php', '-r', "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
  nginx:
    image: 'ghcr.io/fluxwp/wordpress:nginx-1.30'
    restart: unless-stopped
    volumes:
      - 'wordpress-files:/var/www/html:ro'
    environment:
      - SERVICE_URL_NGINX
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/fpm-ping']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
  # One-time setup (auto install, language, Redis, Flux Setup) + WP-Cron every minute.
  worker:
    image: 'ghcr.io/fluxwp/wordpress:worker-php8.4'
    restart: unless-stopped
    volumes:
      - 'wordpress-files:/var/www/html'
    environment:
      - WORDPRESS_DB_HOST=mariadb
      - WORDPRESS_DB_USER=$SERVICE_USER_WORDPRESS
      - WORDPRESS_DB_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
      - WORDPRESS_DB_NAME=${DB_NAME:-wordpress}
      - WORDPRESS_TABLE_PREFIX=${WORDPRESS_TABLE_PREFIX:-wp_}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-256M}
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE:-128M}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE:-128M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-300}
      - PHP_OPCACHE_MEMORY=${PHP_OPCACHE_MEMORY:-192}
      - PHP_TIMEZONE=${PHP_TIMEZONE:-UTC}
      - WP_ENVIRONMENT_TYPE=${WP_ENVIRONMENT_TYPE:-production}
      - WP_REDIS_HOST=redis
      - WP_REDIS_PASSWORD=$SERVICE_PASSWORD_REDIS
      - WP_URL=$SERVICE_URL_NGINX
      - WP_TITLE=${WP_TITLE:-WordPress}
      - WP_ADMIN_USER=${WP_ADMIN_USER:-}
      - WP_ADMIN_PASSWORD=${WP_ADMIN_PASSWORD:-}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL:-}
      - WP_AUTO_INSTALL=${WP_AUTO_INSTALL:-false}
      - WP_LOCALE=${WP_LOCALE:-en_US}
      - WP_TIMEZONE=${WP_TIMEZONE:-UTC}
      - WP_CRON_INTERVAL=${WP_CRON_INTERVAL:-60}
      - FLUXWP_SETUP=${FLUXWP_SETUP:-false}
      - FLUXWP_SETUP_URL=${FLUXWP_SETUP_URL:-}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      wordpress:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    exclude_from_hc: true
  mariadb:
    image: 'mariadb:11.8'
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL_SIZE:-256M}
      - --max-connections=${DB_MAX_CONNECTIONS:-100}
      - --max-allowed-packet=64M
      - --tmp-table-size=32M
      - --max-heap-table-size=32M
      - --skip-name-resolve
      - --performance-schema=OFF
    volumes:
      - 'mariadb-data:/var/lib/mysql'
    environment:
      - MARIADB_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
      - MARIADB_DATABASE=${DB_NAME:-wordpress}
      - MARIADB_USER=$SERVICE_USER_WORDPRESS
      - MARIADB_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
      - MARIADB_AUTO_UPGRADE=1
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
  redis:
    image: 'redis:8.8-alpine'
    restart: unless-stopped
    # Cache only: no persistence, oldest keys are evicted when full.
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ''
      - --appendonly
      - 'no'
      - --requirepass
      - $SERVICE_PASSWORD_REDIS
    environment:
      - REDISCLI_AUTH=$SERVICE_PASSWORD_REDIS
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  wordpress-files:
  mariadb-data:
