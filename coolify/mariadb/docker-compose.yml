# FluxWP docker-wordpress: WordPress + MariaDB (Apache)
# https://github.com/FluxWP/docker-wordpress
#
# Coolify: Projects > Add Resource > Docker Compose Empty > paste this file > Save.
# Coolify generates a domain for the 'wordpress' service; put your own there if you like, then Deploy.
# The worker installs WordPress on first start (WP_AUTO_INSTALL defaults to true).
# A generated admin password is not logged. Read it from the worker:
#   docker compose exec worker cat /run/flx-private/admin-password
# Change the password after the first login, then delete the file:
#   docker compose exec worker rm /run/flx-private/admin-password
# install.php and setup-config.php stay closed unless WP_INSTALL_TOKEN is set.
# Unset WP_INSTALL_TOKEN after the install is finished; a token in the query string can end up in the Apache access log.
# Optional: WP_ADMIN_USER, WP_ADMIN_PASSWORD, WP_ADMIN_EMAIL.
# Flux Setup comes installed; its wizard opens after install. FLUXWP_SETUP=false leaves it out.
# Generated by tools/build.py - edit that, not this file.

services:
  wordpress:
    image: 'ghcr.io/fluxwp/wordpress:7.1-php8.4-apache'
    restart: unless-stopped
    volumes:
      - 'wordpress-files:/var/www/html'
    environment:
      - SERVICE_URL_WORDPRESS
      - WORDPRESS_DB_HOST=mariadb
      - WORDPRESS_DB_USER=$SERVICE_USER_WORDPRESS
      - WORDPRESS_DB_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
      - WORDPRESS_DB_NAME=${DB_NAME:-wordpress}
      - WORDPRESS_TABLE_PREFIX=${WORDPRESS_TABLE_PREFIX:-wp_}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-256M}
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE:-128M}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE:-128M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-300}
      - PHP_OPCACHE_MEMORY=${PHP_OPCACHE_MEMORY:-192}
      - PHP_TIMEZONE=${PHP_TIMEZONE:-UTC}
      - WP_ENVIRONMENT_TYPE=${WP_ENVIRONMENT_TYPE:-production}
      - APACHE_MAX_WORKERS=${APACHE_MAX_WORKERS:-20}
      - WP_INSTALL_TOKEN=${WP_INSTALL_TOKEN:-}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://127.0.0.1/wp-includes/images/blank.gif']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
  # One-time setup (auto install, language, Redis, Flux Setup) + WP-Cron every minute.
  worker:
    image: 'ghcr.io/fluxwp/wordpress:worker-php8.4'
    restart: unless-stopped
    volumes:
      - 'wordpress-files:/var/www/html'
      - 'flx-private:/run/flx-private'
    environment:
      - WORDPRESS_DB_HOST=mariadb
      - WORDPRESS_DB_USER=$SERVICE_USER_WORDPRESS
      - WORDPRESS_DB_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
      - WORDPRESS_DB_NAME=${DB_NAME:-wordpress}
      - WORDPRESS_TABLE_PREFIX=${WORDPRESS_TABLE_PREFIX:-wp_}
      - PHP_MEMORY_LIMIT=${PHP_MEMORY_LIMIT:-256M}
      - PHP_UPLOAD_MAX_FILESIZE=${PHP_UPLOAD_MAX_FILESIZE:-128M}
      - PHP_POST_MAX_SIZE=${PHP_POST_MAX_SIZE:-128M}
      - PHP_MAX_EXECUTION_TIME=${PHP_MAX_EXECUTION_TIME:-300}
      - PHP_OPCACHE_MEMORY=${PHP_OPCACHE_MEMORY:-192}
      - PHP_TIMEZONE=${PHP_TIMEZONE:-UTC}
      - WP_ENVIRONMENT_TYPE=${WP_ENVIRONMENT_TYPE:-production}
      - WP_URL=$SERVICE_URL_WORDPRESS
      - WP_TITLE=${WP_TITLE:-WordPress}
      - WP_ADMIN_USER=${WP_ADMIN_USER:-}
      - WP_ADMIN_PASSWORD=${WP_ADMIN_PASSWORD:-}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL:-}
      - WP_AUTO_INSTALL=${WP_AUTO_INSTALL:-true}
      - WP_LOCALE=${WP_LOCALE:-en_US}
      - WP_TIMEZONE=${WP_TIMEZONE:-UTC}
      - WP_CRON_INTERVAL=${WP_CRON_INTERVAL:-60}
      - WP_BACKGROUND_POLL_INTERVAL=${WP_BACKGROUND_POLL_INTERVAL:-2}
      - WP_BACKGROUND_WORKERS_PER_PLUGIN=${WP_BACKGROUND_WORKERS_PER_PLUGIN:-3}
      - WP_BACKGROUND_MAX_PROCESSES=${WP_BACKGROUND_MAX_PROCESSES:-9}
      - FLUXWP_SETUP=${FLUXWP_SETUP:-true}
      - FLUXWP_SETUP_URL=${FLUXWP_SETUP_URL:-}
      - FLUXWP_SETUP_SHA256=${FLUXWP_SETUP_SHA256:-}
    depends_on:
      mariadb:
        condition: service_healthy
      wordpress:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    exclude_from_hc: true
  mariadb:
    image: 'mariadb:11.8'
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL_SIZE:-256M}
      - --max-connections=${DB_MAX_CONNECTIONS:-100}
      - --max-allowed-packet=64M
      - --tmp-table-size=32M
      - --max-heap-table-size=32M
      - --skip-name-resolve
      - --performance-schema=OFF
    volumes:
      - 'mariadb-data:/var/lib/mysql'
    environment:
      - MARIADB_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
      - MARIADB_DATABASE=${DB_NAME:-wordpress}
      - MARIADB_USER=$SERVICE_USER_WORDPRESS
      - MARIADB_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
      - MARIADB_AUTO_UPGRADE=1
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  wordpress-files:
  flx-private:
  mariadb-data:
