; FluxWP docker-wordpress - PHP overrides.
; Mounted as /usr/local/etc/php/conf.d/zz-flux.ini (loads after the image's own files).
; Every value can be changed from the environment; the defaults after ":-" apply when a variable is unset.

memory_limit        = ${PHP_MEMORY_LIMIT:-256M}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE:-128M}
post_max_size       = ${PHP_POST_MAX_SIZE:-128M}
max_execution_time  = ${PHP_MAX_EXECUTION_TIME:-300}
max_input_time      = ${PHP_MAX_EXECUTION_TIME:-300}
max_input_vars      = ${PHP_MAX_INPUT_VARS:-5000}
date.timezone       = ${PHP_TIMEZONE:-UTC}

; Security
expose_php      = Off
display_errors  = Off
log_errors      = On
allow_url_include = Off
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; Filesystem stat cache (WordPress includes a lot of files)
realpath_cache_size = 4096K
realpath_cache_ttl  = 600

; OPcache
opcache.enable                  = 1
opcache.enable_cli              = 0
opcache.memory_consumption      = ${PHP_OPCACHE_MEMORY:-192}
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files   = 30000
opcache.max_wasted_percentage   = 10
; WordPress invalidates files itself when it updates plugins/themes/core;
; the timestamp check only catches files changed outside WordPress.
opcache.validate_timestamps     = 1
opcache.revalidate_freq         = ${PHP_OPCACHE_REVALIDATE_FREQ:-30}
opcache.save_comments           = 1
; JIT does not help WordPress and costs memory.
opcache.jit                     = disable
opcache.jit_buffer_size         = 0
