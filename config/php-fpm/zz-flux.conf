; FluxWP docker-wordpress - PHP-FPM pool (nginx-fpm variant).
; Mounted as /usr/local/etc/php-fpm.d/zz-flux.conf.
; Rough sizing: each worker uses 40-80 MB, so max_children = (RAM for PHP) / 64M.
[www]
pm                   = dynamic
pm.max_children      = ${PHP_FPM_MAX_CHILDREN:-10}
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests      = 500
request_terminate_timeout = ${PHP_MAX_EXECUTION_TIME:-300}

; Used by the nginx healthcheck (/fpm-ping, localhost only).
ping.path     = /fpm-ping
ping.response = pong

; Keep container env visible to PHP (getenv() in wp-config.php).
clear_env = no
