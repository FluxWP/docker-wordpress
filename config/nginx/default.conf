# FluxWP docker-wordpress - nginx in front of PHP-FPM (nginx-fpm variant).
# Installed in the image as /etc/nginx/templates/default.conf.template and
# rendered to /etc/nginx/conf.d/default.conf on start (substituting ${WP_INSTALL_TOKEN}).
# Upload size is limited by PHP (PHP_UPLOAD_MAX_FILESIZE / PHP_POST_MAX_SIZE);
# nginx only sets an upper bound here.

upstream php {
    server wordpress:9000;
    keepalive 8;
}

# Install screen stays closed unless WP_INSTALL_TOKEN matches the query, cookie, or
# X-WP-Install-Token header. The token is restricted to 1-128 alphanumeric characters
# so it cannot break this file when envsubst inserts it. Empty token: always closed.
map $uri $flx_install_token {
    default "${WP_INSTALL_TOKEN}";
}

map "$flx_install_token:$arg_wp_install_token" $flx_query_ok {
    default 0;
    "~^(?<t>[A-Za-z0-9]{1,128}):\k<t>$" 1;
}

map "$flx_install_token:$cookie_wp_install_token" $flx_cookie_ok {
    default 0;
    "~^(?<t>[A-Za-z0-9]{1,128}):\k<t>$" 1;
}

map "$flx_install_token:$http_x_wp_install_token" $flx_header_ok {
    default 0;
    "~^(?<t>[A-Za-z0-9]{1,128}):\k<t>$" 1;
}

map "$flx_query_ok$flx_cookie_ok$flx_header_ok" $flx_token_ok {
    default 0;
    "100" 1;
    "010" 1;
    "001" 1;
    "110" 1;
    "101" 1;
    "011" 1;
    "111" 1;
}

map $flx_query_ok $flx_install_cookie {
    default "";
    "1" "wp_install_token=$flx_install_token; Path=/wp-admin/; HttpOnly; SameSite=Strict";
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php;

    server_tokens off;
    client_max_body_size 1024M;

    # Real client IP behind a reverse proxy (only private networks are trusted).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml application/atom+xml image/svg+xml
               font/ttf font/otf application/vnd.ms-fontobject;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Healthcheck: nginx + PHP-FPM, localhost only.
    location = /fpm-ping {
        access_log off;
        allow 127.0.0.1;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-ping;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
        fastcgi_pass php;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { try_files $uri /index.php?$args; access_log off; log_not_found off; }

    # Hidden files (except .well-known) and files that should never be public.
    location ~ /\.(?!well-known/) { deny all; }
    location ~* ^/(wp-config\.php|readme\.html|license\.txt)$ { deny all; }
    # No PHP from uploads.
    location ~* ^/wp-content/uploads/.*\.(php|phtml|phar)$ { deny all; }

    # No end anchor: /install.php/extra (PATH_INFO) is the same script.
    location ~* ^/wp-admin/(?:install|setup-config)\.php(?:/|$) {
        access_log off;
        if ($flx_token_ok = 0) {
            return 403;
        }
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Set-Cookie $flx_install_cookie always;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_keep_conn on;
        fastcgi_read_timeout 600s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_pass php;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~* \.(?:css|js|mjs|map|woff2?|ttf|otf|eot|svg|ico|png|jpe?g|gif|webp|avif|mp4|webm)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        fastcgi_keep_conn on;
        fastcgi_read_timeout 600s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_pass php;
    }
}
