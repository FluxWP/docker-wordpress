# FluxWP Docker - nginx in front of PHP-FPM (nginx-fpm variant).
# Installed in the image as /etc/nginx/templates/default.conf.template and
# rendered to /etc/nginx/conf.d/default.conf on start (substituting ${WP_INSTALL_TOKEN}).
# Upload size is limited by PHP (PHP_UPLOAD_MAX_FILESIZE / PHP_POST_MAX_SIZE);
# nginx only sets an upper bound here.

upstream php {
    server wordpress:9000;
    keepalive 8;
}

# Install screen stays closed unless WP_INSTALL_TOKEN matches the query, cookie, or
# X-WP-Install-Token header. The token is restricted to 1-128 alphanumeric characters
# so it cannot break this file when envsubst inserts it. Empty token: always closed.
map $uri $flx_install_token {
    default "${WP_INSTALL_TOKEN}";
}

map "$flx_install_token:$arg_wp_install_token" $flx_query_ok {
    default 0;
    "~^(?<t>[A-Za-z0-9]{1,128}):\k<t>$" 1;
}

map "$flx_install_token:$cookie_wp_install_token" $flx_cookie_ok {
    default 0;
    "~^(?<t>[A-Za-z0-9]{1,128}):\k<t>$" 1;
}

map "$flx_install_token:$http_x_wp_install_token" $flx_header_ok {
    default 0;
    "~^(?<t>[A-Za-z0-9]{1,128}):\k<t>$" 1;
}

map "$flx_query_ok$flx_cookie_ok$flx_header_ok" $flx_token_ok {
    default 0;
    "100" 1;
    "010" 1;
    "001" 1;
    "110" 1;
    "101" 1;
    "011" 1;
    "111" 1;
}

# WP_AUTO_INSTALL not true (default false): the install screen is open. Substituted by envsubst; the
# entrypoint keeps it alphanumeric.
map $uri $flx_auto_install {
    default "${WP_AUTO_INSTALL}";
}

map "$flx_token_ok:$flx_auto_install" $flx_install_allowed {
    default 1;
    "~^1:" 1;
    "~^0:(?i:true|1|yes|on)$" 0;
}

map $flx_query_ok $flx_install_cookie {
    default "";
    "1" "wp_install_token=$flx_install_token; Path=/wp-admin/; HttpOnly; SameSite=Strict";
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php;

    server_tokens off;
    client_max_body_size 1024M;

    # Real client IP behind a reverse proxy (only private networks are trusted).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml application/atom+xml image/svg+xml
               font/ttf font/otf application/vnd.ms-fontobject;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Healthcheck: nginx + PHP-FPM, localhost only.
    location = /fpm-ping {
        access_log off;
        allow 127.0.0.1;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME /fpm-ping;
        fastcgi_param SCRIPT_FILENAME /fpm-ping;
        fastcgi_pass php;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { try_files $uri /index.php?$args; access_log off; log_not_found off; }

    # Hidden files (except .well-known) and files that should never be public.
    location ~ /\.(?!well-known/) { deny all; }
    location ~* ^/(wp-config\.php|readme\.html|license\.txt)$ { deny all; }
    # No PHP from uploads.
    location ~* ^/wp-content/uploads/.*\.(php|phtml|phar)$ { deny all; }

    # No end anchor: /install.php/extra (PATH_INFO) is the same script.
    location ~* ^/wp-admin/(?:install|setup-config)\.php(?:/|$) {
        access_log off;
        default_type text/html;
        if ($flx_install_allowed = 0) {
            # A new site is installed by the worker; until then WordPress sends visitors here. Say so instead of a bare 403.
            return 403 "<!doctype html><meta charset=utf-8><meta http-equiv=refresh content=10><title>Setting up</title><body style='font:16px system-ui;max-width:34em;margin:12vh auto;padding:0 1em'><h1>WordPress is being set up</h1><p>The worker container installs the site within the first minute after the first start. This page reloads itself.</p><p>If it stays here, read the worker log: <code>docker compose logs worker</code> (Coolify: open the worker container, Logs).</p>";
        }
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Set-Cookie $flx_install_cookie always;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_keep_conn on;
        fastcgi_read_timeout 600s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_pass php;
    }

    # FluxWP Realtime (WebSocket). Resolved per request through Docker's DNS, so nginx still starts
    # when the realtime service is removed from the stack (then this path answers 502 and clients poll).
    location ^~ /flx-rt {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $flx_realtime http://realtime:80;
        proxy_pass $flx_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~* \.(?:css|js|mjs|map|woff2?|ttf|otf|eot|svg|ico|png|jpe?g|gif|webp|avif|mp4|webm)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_PROXY "";
        fastcgi_keep_conn on;
        fastcgi_read_timeout 600s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_pass php;
    }
}
