name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generated files are up to date
        run: python3 tools/build.py --check

      - name: Worker script syntax
        run: sh -n scripts/worker.sh && sh -n images/min-php.sh && sh -n scripts/nginx-entrypoint.sh

      - name: Worker wake behavior
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4'

      - name: Realtime server and mu-plugin against Redis
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          REDIS_PASSWORD: ci-redis
        run: |
          docker run -d --rm --name ci-redis -p 6379:6379 redis:8.8-alpine redis-server --requirepass ci-redis --save ''
          for i in $(seq 1 20); do docker exec ci-redis redis-cli -a ci-redis ping 2>/dev/null | grep -q PONG && break; sleep 0.5; done
          php -l config/wordpress/flx-realtime.php
          bun test images/realtime
          php tests/realtime.php
          docker stop ci-redis

      - name: Compose files are valid
        run: |
          for dir in compose/*/; do
            cp "$dir/.env.example" "$dir/.env"
            sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=ci/;s/^DB_ROOT_PASSWORD=$/DB_ROOT_PASSWORD=ci/;s/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci/;s/^WPAPI_KEY=$/WPAPI_KEY=ci/' "$dir/.env"
            (cd "$dir" && docker compose config -q) && echo "ok $dir"
            rm "$dir/.env"
          done
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=ci/;s/^DB_ROOT_PASSWORD=$/DB_ROOT_PASSWORD=ci/;s/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci/' .env
          docker compose -f docker-compose.local.yml config -q && echo "ok docker-compose.local.yml"
          rm .env
          for f in docker-compose.yml coolify/*/docker-compose.yml coolify-template/*.yaml; do
            python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f" && echo "ok $f"
          done

  smoke:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [mariadb, mysql, mariadb-redis, nginx-fpm]
    defaults:
      run:
        working-directory: compose/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4
      - name: Build images from this commit
        run: |
          python3 tools/build.py --matrix | python3 -c '
          import json, subprocess, sys
          for b in json.load(sys.stdin)["include"]:
              subprocess.run(["docker", "build", "--pull", "-q", "-f", b["dockerfile"], "--build-arg", "BASE=" + b["base"],
                              "-t", "ghcr.io/fluxwp/wordpress:" + b["tag"], "."], check=True)
          '
      - name: Start
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=ci-db/;s/^DB_ROOT_PASSWORD=$/DB_ROOT_PASSWORD=ci-root/;s/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci-redis/;s/^WP_ADMIN_EMAIL=$/WP_ADMIN_EMAIL=ci@example.com/;s/^WP_ADMIN_PASSWORD=$/WP_ADMIN_PASSWORD=ci-admin/;s/^WP_AUTO_INSTALL=false$/WP_AUTO_INSTALL=true/;s/^FLX_REALTIME_SECRET=$/FLX_REALTIME_SECRET=ci-realtime-secret-0123456789abcdef0123/' .env
          docker compose up -d --wait --wait-timeout 300
      - name: Installed and serving
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T worker wp core is-installed && break
            sleep 5
          done
          docker compose exec -T worker wp core is-installed
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -o /dev/null http://localhost:8080/wp-login.php
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/wp-config.php)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/wp-admin/install.php)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/wp-admin/setup-config.php)" = 403
          docker compose exec -T wordpress php -r 'exit(ini_get("session.upload_progress.enabled") ? 1 : 0);'
      - name: FluxWP Panel and Redis
        run: |
          for i in $(seq 1 24); do
            docker compose exec -T worker wp plugin is-active flx-setup && break
            sleep 5
          done
          docker compose exec -T worker wp plugin is-active flx-setup
          if grep -q '^REDIS_PASSWORD' .env; then
            for i in $(seq 1 24); do
              if docker compose exec -T worker wp redis status 2>/dev/null | grep -Eqi '^Status:[[:space:]]+Connected'; then
                break
              fi
              sleep 5
            done
            docker compose exec -T worker wp redis status | grep -Eqi '^Status:[[:space:]]+Connected'
          fi
      - name: Realtime (stacks with Redis)
        run: |
          grep -q '^FLX_REALTIME_SECRET=' .env || exit 0
          docker compose exec -T worker wp flx realtime test
          if grep -q '^FLX_REALTIME_URL=/flx-rt' .env; then
            # nginx-fpm: the WebSocket path is served through nginx.
            test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/flx-rt)" = 426
          fi
      - name: Logs
        if: always()
        run: docker compose logs --tail 100
